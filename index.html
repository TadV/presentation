<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#100e0c">
  <meta name="description" content="Мафия — полноэкранная презентация.">
  <title>Мафия — презентация</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="presentation" aria-label="Презентация «Мафия»">
    <div id="screen">
      <img id="slide-a" class="slide standby" alt="" draggable="false">
      <img id="slide-b" class="slide standby" alt="" draggable="false">
    </div>
    <div id="heading" class="chrome" aria-hidden="true">МАФИЯ <span>ПРЕЗЕНТАЦИЯ</span></div>
    <div id="message" role="status" aria-live="polite"></div>
    <div id="error" role="alert" hidden>
      <p>Не удалось загрузить слайд.</p>
      <button id="retry" type="button">Повторить</button>
    </div>
    <div id="controls" class="chrome" role="group" aria-label="Управление презентацией">
      <button id="previous" class="arrow" type="button" title="Предыдущий слайд (←)" aria-label="Предыдущий слайд">&#8249;</button>
      <span id="counter" aria-live="polite" aria-atomic="true"><b id="current">01</b><span class="separator">/</span><span id="total">06</span></span>
      <button id="next" class="arrow" type="button" title="Следующий слайд (→)" aria-label="Следующий слайд">&#8250;</button>
      <span class="divider" aria-hidden="true"></span>
      <button id="rotate" type="button" title="Повернуть всю презентацию на 90° (R)" aria-label="Повернуть всю презентацию на 90 градусов" aria-pressed="false"><span class="rotate-icon" aria-hidden="true">&#8635;</span><span class="button-label">Повернуть</span></button>
      <button id="fullscreen" type="button" title="На весь экран (F)" aria-label="На весь экран" aria-pressed="false"><span class="fullscreen-icon" aria-hidden="true"></span><span class="button-label">Весь экран</span></button>
    </div>
    <div id="progress" aria-hidden="true"><span id="progress-fill"></span></div>
  </main>
  <noscript><p class="noscript">Для переключения слайдов включите JavaScript. <a href="slides/slide-01.png">Открыть первый слайд</a>.</p></noscript>
  <script src="slides.js"></script>
  <script src="script.js"></script>
</body>
</html>
